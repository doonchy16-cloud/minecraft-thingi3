name: Promote Worldmind V1.2 Release

on:
  push:
    branches:
      - worldmind-v1.2-ci
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout CI host with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct certified V1.1 baseline
        shell: bash
        run: |
          set -euo pipefail
          cat \
            worldmind-v1.1-ci/source.part00.b64 \
            worldmind-v1.1-ci/source.part01.b64 \
            worldmind-v1.1-ci/fix02.part00.b64 \
            worldmind-v1.1-ci/fix02.part01.b64 \
            worldmind-v1.1-ci/fix02.part02.b64 \
            worldmind-v1.1-ci/fix02.part03.b64 \
            worldmind-v1.1-ci/fix02.part04.b64 \
            worldmind-v1.1-ci/fix03.part00.b64 \
            worldmind-v1.1-ci/fix03.part01.b64 \
            worldmind-v1.1-ci/fix03.part02.b64 \
            worldmind-v1.1-ci/fix03.part03.b64 \
            worldmind-v1.1-ci/fix03.part04.b64 \
            worldmind-v1.1-ci/fix04.part00.b64 \
            worldmind-v1.1-ci/fix04.part01.b64 \
            worldmind-v1.1-ci/fix04.part02.b64 \
            worldmind-v1.1-ci/fix04.part03.b64 \
            worldmind-v1.1-ci/fix04p4.00.b64 \
            worldmind-v1.1-ci/fix04p4.01.b64 \
            worldmind-v1.1-ci/fix04p4.02.b64 \
            worldmind-v1.1-ci/fix04p4.03.b64 \
            worldmind-v1.1-ci/source.part05.b64 \
            worldmind-v1.1-ci/source.part06.b64 \
            > /tmp/worldmind-v1.1.b64
          base64 -d /tmp/worldmind-v1.1.b64 > /tmp/worldmind-v1.1.zip
          echo "5299d7d4a91c7a71a687407ca34dae72ceaecfa3a96921c0f48b10467525ffdf  /tmp/worldmind-v1.1.zip" | sha256sum -c -
          mkdir -p worldmind-src
          unzip -q /tmp/worldmind-v1.1.zip -d worldmind-src

      - name: Apply exact V1.2 patch and verify source tree
        shell: bash
        run: |
          set -euo pipefail
          cat \
            worldmind-v1.2-ci/patch.part00.b64 \
            worldmind-v1.2-ci/patch.part01.b64 \
            worldmind-v1.2-ci/patch.part02.b64 \
            worldmind-v1.2-ci/patch.part03a.b64 \
            worldmind-v1.2-ci/patch.part03b0.b64 \
            worldmind-v1.2-ci/patch.part03b1.b64 \
            worldmind-v1.2-ci/patch.part03b2.b64 \
            worldmind-v1.2-ci/patch.part03b3.b64 \
            worldmind-v1.2-ci/patch.part04.b64 \
            worldmind-v1.2-ci/patch.part05.b64 \
            worldmind-v1.2-ci/patch.part06.b64 \
            worldmind-v1.2-ci/patch.part07.b64 \
            worldmind-v1.2-ci/patch.part08.b64 \
            worldmind-v1.2-ci/patch.part09.b64 \
            > /tmp/worldmind-v1.2-patch.b64
          base64 -d /tmp/worldmind-v1.2-patch.b64 > /tmp/worldmind-v1.2.patch.gz
          echo "d486ad9667a871424c10eb3e09414731f09a0237db3d3ecd275d825075903cec  /tmp/worldmind-v1.2.patch.gz" | sha256sum -c -
          gzip -dc /tmp/worldmind-v1.2.patch.gz > /tmp/worldmind-v1.2.patch
          (cd worldmind-src && patch -p1 < /tmp/worldmind-v1.2.patch)
          ACTUAL="$(cd worldmind-src && find . -type f -not -path './build/*' -not -path './.gradle/*' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          test "$ACTUAL" = "fed243375c6f0b5022cc3f9090e3f828e6e0c1304bc6b7efcef18c33b397a90c"

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Verify release source before promotion
        working-directory: worldmind-src
        run: gradle --no-daemon test build

      - name: Guard release source against forced remote chunk loading
        working-directory: worldmind-src
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'getChunk\(|setChunkForced|addRegionTicket|forceLoad' \
            src/main/java/dev/worldmind/sim \
            src/main/java/dev/worldmind/materialize \
            src/main/java/dev/worldmind/ai; then
            echo 'Forbidden forced-chunk-loading pattern found.'
            exit 1
          fi

      - name: Create clean release branch from main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf worldmind-src/build worldmind-src/.gradle
          mkdir -p /tmp/worldmind-release
          cp -a worldmind-src/. /tmp/worldmind-release/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B worldmind-v1.2-release origin/main
          git rm -r .
          git clean -fdx
          cp -a /tmp/worldmind-release/. .
          git add -A

          ACTUAL="$(find . -type f -not -path './.git/*' -not -path './build/*' -not -path './.gradle/*' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          test "$ACTUAL" = "fed243375c6f0b5022cc3f9090e3f828e6e0c1304bc6b7efcef18c33b397a90c"

          git commit -m "release: promote Worldmind v1.2.0 source"
          git push --force-with-lease origin HEAD:refs/heads/worldmind-v1.2-release
